<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>

	<link href="/stylesheet.css" rel="stylesheet" type="text/css"/>

    <script src="/js/sitedata.min.js"></script>
	<script src="/js/markdown.js"></script>

    <script src="/js/utils.js"></script>
    <script src="/js/announcements.js"></script>

    <!-- Data sources -->
    <link data-include="content" rel="preload" as="fetch"
        title="navbar" type="text/html" href="/fragments/navbar.html" />
    <link data-include="content" rel="preload" as="fetch"
        title="footer" type="text/html" href="/fragments/footer.html" />

    <link data-include="data" rel="preload" as="fetch"
        href="/data/announcements.json" />
    <link data-include="content" rel="preload" as="fetch"
        title="newsCard" type="text/html" href="/fragments/homeAnnouncement.html" />

    <title>Food Not Bombs Edmonton</title>

    <script>
        document.addEventListener("sitedata-finish", () => {
            // Find the homepage announcement
            const announcementID = SiteData.query("homepage_announcement");
            announcement = SiteData.query("announcements").find(elem => {
                if (!("id" in elem)) return false;
                return (elem.id === announcementID);
            });

            // Generate the announcement card
            let container = document.getElementById("announcement");
            createAnnouncementCard(container, announcement);

            // Populate data & render markdown
            SiteData.populateDocument(container);
            renderMarkdown(container);
        });
    </script>
</head>

<body>
	<div class="content gradient">
        <nav data-driven="innerHTML=@navbar"></nav>
		<div class="container">
            <!-- Newletter -->
            <div class="row justify-content-center" id="announcement"></div>

            <!-- Buttons -->
            <br>
            <div class="d-flex flex-column mb-2 flex-fill">
                <a class="btn btn-success btn-lg flex-fill" role="button" href="hth.html">
                    Request a Meal!
                </a>
            </div>
            <div class="d-flex flex-row gap-2">
                <div class="d-flex flex-column gap-1" style="flex:1">
                    <a class="btn btn-primary btn-lg flex-fill" role="button" href="how_to_join.html">
                        Volunteer with Us!
                    </a>
                    <a class="btn btn-secondary btn-lg flex-fill" role="button" href="projects.html">
                        Our Projects
                    </a>
                </div>
                <div class="d-flex flex-column gap-1" style="flex:1">
                    <a class="btn btn-primary btn-lg flex-fill" role="button" data-driven="href=links.gofundme">
                        Donate!
                    </a>
                    <a class="btn btn-secondary btn-lg flex-fill" role="button" href="library.html">
                        Our Library
                    </a>
                </div>
            </div>

            <!-- About Us -->
			<div class="row justify-content-center">
				<div class="col-12">
                    
					<div class="card">
						<div class="card-body">
                            <pre class="markdown" data-src="/content/about.md"></pre>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
    <footer data-driven="innerHTML=@footer"></footer>
</body>
</html>
