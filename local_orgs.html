<!doctype html>
<html lang="en">
  <head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>

	<link href="/stylesheet.css" rel="stylesheet" type="text/css"/>

    <script src="/js/sitedata.min.js"></script>
	<script src="/js/markdown.min.js"></script>
    <script src="/js/utils.js"></script>

    <!-- Data sources -->
    <link data-include="content" rel="preload" as="fetch"
        title="navbar" type="text/html" href="/fragments/navbar.html" />
    <link data-include="content" rel="preload" as="fetch"
        title="footer" type="text/html" href="/fragments/footer.html" />

    <link data-include="data" rel="preload" as="fetch"
        href="/data/local_orgs.json" />

	<title>Local Organizations — Food Not Bombs Edmonton</title>

    <script>
        document.addEventListener("sitedata-finish", () => {
            const localOrgs = SiteData.query("local_orgs");
            const orgLinkTemplate = document.getElementById("orgLinkTemplate");

            for (const org of localOrgs) {
                const link = document.importNode(orgLinkTemplate.content, true);

                link.querySelector(".org-title").innerHTML = org.name;
                link.querySelector(".org-desc").innerHTML = org.description;
                link.querySelector("a").href = org.url;

                document.getElementById("org-list").appendChild(link);
            }
        });
    </script>
</head>
<body>
	<div class="content gradient">
        <nav data-driven="innerHTML=@navbar"></nav>
		<div class="container">
			<div class="card">
				<div class="card-body">
					<div class="row justify-content-center">
						<h1>Links to Local Organizations</h1>
					</div>
					<div class="content">
						<p class="lead">Local groups whose work we love 💚</p>
						<ul id="org-list" class="list-group">
                            <template id="orgLinkTemplate">
                                <a target="_blank" class="list-group-item list-group-item-action">
                                    <h5 class="org-title"></h5>
                                    <small class="org-desc"></small>
                                </a>
                            </template>
						</ul>
					</div>
				</div>
			</div> 
		</div>
	</div>
    <footer data-driven="innerHTML=@footer"></footer>
</body>
</html>
