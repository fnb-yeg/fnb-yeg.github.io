<!doctype html>
<html lang="en">
  <head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>

	<link href="/stylesheet.css" rel="stylesheet" type="text/css"/>

    <script src="/js/sitedata.min.js"></script>
	<script src="/js/markdown.min.js"></script>
    <script src="/js/utils.js"></script>

    <!-- Data sources -->
    <link data-include="content" rel="preload" as="fetch"
        title="navbar" type="text/html" href="/fragments/navbar.html" />
    <link data-include="content" rel="preload" as="fetch"
        title="footer" type="text/html" href="/fragments/footer.html" />

    <link data-include="data" rel="preload" as="fetch"
        href="/data/projects.json" />

	<title>Projects — Food Not Bombs Edmonton</title>

    <script>
        document.addEventListener("sitedata-finish", () => {
            const projects = SiteData.query("projects");
            const projContainer = document.getElementById("projects");

            const projectCardTemplate = document.getElementById("projectCardTemplate").content;
            const actionButtonTemplate = document.getElementById("actionButtonTemplate").content;


            for (const project of projects) {
                const card = document.importNode(projectCardTemplate, true);
                const cardBody = card.querySelector(".card-body");

                // Card title
                card.querySelector(".card-header").innerText = project.title;

                // Card image
                const img = card.querySelector(".card-img");
                [img.src, img.alt] = getImageData(project.image);

                // Card description
                if ("description" in project) {
                    const desc = card.querySelector(".description");
                    desc.innerHTML = getMDContent(project.description);
                }

                // TODO: support data-driven values in action buttons
                // TODO: (particularly in action URL)

                // Action buttons
                if ("actions" in project) {
                    for (const action of project.actions) {
                        const btnContainer = document.importNode(actionButtonTemplate, true);
                        const btn = btnContainer.querySelector(".btn");

                        btn.innerText = action.label;
                        btn.href = action["url"];

                        if ("target" in action) btn.target = action.target;

                        if (!("style" in action)) action.style = "btn-outline-success";

                        if ("disabled" in action && action.disabled) {
                            btn.classList.add("disabled");
                            action.style = "btn-outline-secondary";
                        }

                        btn.classList.add(action.style);

                        cardBody.appendChild(btnContainer);
                    }
                }

                // Image transcription
                if ("transcription" in project) {
                    makeImageTranscription(cardBody,
                        getMDContent(project.transcription));
                }

                projContainer.appendChild(card);
            }

            renderMarkdown(projContainer);
        });
    </script>
</head>
<body>
	<div class="content gradient">
        <nav data-driven="innerHTML=@navbar"></nav>
		<div class="container">
            <div class="row" id="projects">
            </div>

            <template id="projectCardTemplate">
                <div class="col-xs-12 col-sm-6 col-lg-4">
                    <div class="card">
                        <h3 class="card-header"></h3>
                        <div class="card-body">
                            <div class="content">
                                <img class="card-img" />
                                <div class="description"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <template id="actionButtonTemplate">
                <div class="pt-3 d-flex justify-content-center">
                    <a role="button" class="btn"></a>
                </div>
            </template>

            <hr />

			<div class="row justify-content-center">
				<div class="col-sm-6 col-xs-12">
					<div class="card">
						<img src="/images/food_sovereignty.png">
					</div>
				</div>
			</div>
		</div> 
	</div>
    <footer data-driven="innerHTML=@footer"></footer>
</body>
</html>
